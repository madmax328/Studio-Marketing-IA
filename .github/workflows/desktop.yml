name: Application de bureau

# Compile l'application de bureau (Windows) quand son code change, ou à la demande.
# Une étiquette « desktop-v1.2.3 » publie en plus une version téléchargeable (GitHub Releases).
on:
  push:
    branches: ["**"]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Bibliothèques système (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    needs: verifier
    runs-on: windows-latest
    env:
      # Adresse du site ouverte par l'application (variable du dépôt SMIA_APP_URL, sinon l'adresse par défaut).
      SMIA_APP_URL: ${{ vars.SMIA_APP_URL || 'https://studio-marketing-ia.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilation de l'installateur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'Studio Marketing IA (bureau) __VERSION__' || '' }}
          releaseBody: "Application de bureau de Studio Marketing IA pour Windows, avec IA locale (Ollama)."
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: studio-marketing-ia-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
