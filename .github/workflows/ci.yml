name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        # MongoDB 8.x ne démarre pas sur les noyaux Linux 6.19 à 7.0.13 des machines GitHub
        # (incompatibilité TCMalloc, SERVER-121912). Le code n'utilise rien de propre à la version 8.
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
      - run: pnpm build
